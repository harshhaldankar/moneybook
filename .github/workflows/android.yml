name: Android APK

# main      → tested, signed APK published as a release (phones get the update banner/notification)
# preview   → same APK, kept as a download on the workflow run only: try it on your phone first, nobody is notified
on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.1.${{ github.run_number }}${{ github.ref != 'refs/heads/main' && '-preview' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, to see whether RELEASE_NOTES.md changed in this push

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (JS SMS parser)
        run: npm test

      - name: Copy web app into the Android project
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: npm run build:web && npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests (SMS parser)
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MoneyBook.apk"
          else
            echo "::warning::No signing key secrets set; building a debug-signed APK. Updates may need an uninstall first."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/MoneyBook.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyBook-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/MoneyBook.apk

      # Release text: RELEASE_NOTES.md when it was updated in this push, otherwise the commit headline.
      # Its first line ("What's new: ...") is what the in-app banner and the update notification show.
      - name: Write release notes
        if: github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
          HEADLINE: ${{ github.event.head_commit.message }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          changed=no
          if [ -f RELEASE_NOTES.md ]; then
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || ! git diff --quiet "$BEFORE" HEAD -- RELEASE_NOTES.md; then changed=yes; fi
          fi
          if [ "$changed" = yes ]; then
            cat RELEASE_NOTES.md > "$notes"
          else
            first_line=$(printf '%s\n' "${HEADLINE:-Improvements and fixes}" | head -n 1)
            echo "What's new: ${first_line}" > "$notes"
          fi
          printf '\nDownload **MoneyBook.apk** below and open it on your Android phone to install or update.\nBuilt from %s.\n' "$GITHUB_SHA" >> "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
          cat "$notes"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: MoneyBook ${{ env.VERSION_NAME }}
          body_path: ${{ env.NOTES_FILE }}
          files: ${{ runner.temp }}/MoneyBook.apk
          make_latest: true

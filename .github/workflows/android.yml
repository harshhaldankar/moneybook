name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into the Android project
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: npm run build:web && npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests (SMS parser)
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MoneyBook.apk"
          else
            echo "::warning::No signing key secrets set; building a debug-signed APK. Updates may need an uninstall first."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/MoneyBook.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyBook-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/MoneyBook.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: MoneyBook ${{ env.VERSION_NAME }}
          body: |
            What's new: ${{ github.event.head_commit.message || 'Improvements and fixes' }}

            Download **MoneyBook.apk** below and open it on your Android phone to install or update.
            Built from ${{ github.sha }}.
          files: ${{ runner.temp }}/MoneyBook.apk
          make_latest: true
